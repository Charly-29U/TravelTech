server:
  port: ${PORT:8080}

spring:
  application:
    name: traveltech-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/traveltech_db}
    username: ${SPRING_DATASOURCE_USERNAME:traveltech}
    password: ${SPRING_DATASOURCE_PASSWORD:secure123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000

logging:
  level:
    com.traveltech: INFO
    org.springframework.security: WARN
